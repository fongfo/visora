[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "visora-local-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "numpy>=2,<3", "imageio-ffmpeg>=0.6,<0.7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
visora-validate = "visora_engine.validation:main"

[tool.setuptools.packages.find]
where = ["packages/engine"]

[tool.pytest.ini_options]
pythonpath = ["packages/engine"]
testpaths = ["tests"]
